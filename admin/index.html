<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
</head>
<body>

<div id="setup" style="display:none">
  <input type="password" id="tokenInput" autocomplete="off" /><br>
  <small id="setupStatus"></small><br>
  <button onclick="saveToken()">go</button>
</div>

<div id="main" style="display:none">
  <button onclick="showEditor(null)">+</button>
  <small id="mainStatus"></small>
  <div id="notesList"></div>
  <br><small><a href="#" onclick="clearToken()">sign out</a></small>
</div>

<div id="editor" style="display:none">
  <small id="editorStatus"></small><br>
  <input type="text" id="fTitle" placeholder="title" /><br>
  <input type="date" id="fDate" /><br>
  <input type="text" id="fPreview" placeholder="summary" /><br>
  <textarea id="fContent" rows="10" cols="50"></textarea><br>
  <input type="text" id="fTags" placeholder="tags" /><br>
  <button onclick="saveNote()">save</button>
  <button onclick="showMain()">back</button>
</div>

<script>
const OWNER  = 'Andrew-most-likely';
const REPO   = 'Personal-Website';
const FILE   = 'JSON/notes.json';
const BRANCH = 'main';

let token = localStorage.getItem('gh_token');
let notesSha = null;
let notes = [];
let editingIndex = null;

function show(id) {
  ['setup','main','editor'].forEach(s => document.getElementById(s).style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

async function ghFetch(path, opts = {}) {
  return fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${path}`, {
    ...opts,
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
}

async function loadNotes() {
  const res = await ghFetch(`contents/${FILE}?ref=${BRANCH}`);
  if (!res.ok) throw new Error(res.status);
  const data = await res.json();
  notesSha = data.sha;
  notes = JSON.parse(atob(data.content.replace(/\n/g,''))).notes || [];
}

async function commitNotes(msg) {
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify({ notes }, null, 2))));
  const res = await ghFetch(`contents/${FILE}`, { method: 'PUT', body: JSON.stringify({ message: msg, content: encoded, sha: notesSha, branch: BRANCH }) });
  if (!res.ok) throw new Error((await res.json().catch(()=>({}))).message || 'failed');
  notesSha = (await res.json()).content.sha;
}

function today() { return new Date().toISOString().slice(0,10); }

async function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  token = t;
  document.getElementById('setupStatus').textContent = '…';
  try { await loadNotes(); localStorage.setItem('gh_token', token); showMain(); }
  catch { document.getElementById('setupStatus').textContent = 'invalid'; }
}

function clearToken() { localStorage.removeItem('gh_token'); token = null; show('setup'); }

async function showMain() {
  show('main');
  document.getElementById('mainStatus').textContent = '…';
  document.getElementById('notesList').innerHTML = '';
  try { await loadNotes(); document.getElementById('mainStatus').textContent = ''; renderList(); }
  catch { document.getElementById('mainStatus').textContent = 'error'; }
}

function renderList() {
  document.getElementById('notesList').innerHTML = [...notes]
    .map((n,i)=>({...n,_i:i}))
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .map(n=>`<div>${n.title} <small>${n.date}</small> <button onclick="showEditor(${n._i})">edit</button> <button onclick="deleteNote(${n._i})">del</button></div>`)
    .join('') || '<small>none</small>';
}

function showEditor(index) {
  editingIndex = index;
  show('editor');
  document.getElementById('editorStatus').textContent = '';
  const n = index !== null ? notes[index] : null;
  document.getElementById('fTitle').value   = n ? n.title   : '';
  document.getElementById('fDate').value    = n ? n.date    : today();
  document.getElementById('fPreview').value = n ? n.preview : '';
  document.getElementById('fContent').value = n ? n.content : '';
  document.getElementById('fTags').value    = n ? n.tags.join(', ') : '';
}

async function saveNote() {
  const title   = document.getElementById('fTitle').value.trim();
  const date    = document.getElementById('fDate').value;
  const preview = document.getElementById('fPreview').value.trim();
  const content = document.getElementById('fContent').value.trim();
  const tags    = document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if (!title || !date || !content) { document.getElementById('editorStatus').textContent = 'missing fields'; return; }
  document.getElementById('editorStatus').textContent = '…';
  const note = { title, date, preview, content, tags, lastUpdated: today() };
  const prev = editingIndex !== null ? notes[editingIndex] : null;
  if (editingIndex === null) notes.push(note); else notes[editingIndex] = note;
  try {
    await commitNotes(editingIndex === null ? `Add note: ${title}` : `Update note: ${title}`);
    document.getElementById('editorStatus').textContent = 'saved';
    setTimeout(showMain, 1200);
  } catch(e) {
    if (editingIndex === null) notes.pop(); else if (prev) notes[editingIndex] = prev;
    document.getElementById('editorStatus').textContent = `error: ${e.message}`;
  }
}

async function deleteNote(index) {
  if (!confirm(`delete "${notes[index].title}"?`)) return;
  const removed = notes.splice(index,1)[0];
  document.getElementById('mainStatus').textContent = '…';
  try { await commitNotes(`Delete note: ${removed.title}`); renderList(); document.getElementById('mainStatus').textContent = ''; }
  catch(e) { notes.splice(index,0,removed); document.getElementById('mainStatus').textContent = `error: ${e.message}`; }
}

if (token) showMain(); else show('setup');
</script>
</body>
</html>
