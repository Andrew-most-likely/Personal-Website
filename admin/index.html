<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5; color: #333;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px; min-height: 100vh; padding: 2rem 1.25rem;
    }
    h2 { font-size: 1rem; font-weight: normal; color: #555; margin-bottom: 1.25rem; }
    label {
      display: block; font-size: 0.78rem; color: #666;
      margin-top: 1rem; margin-bottom: 0.25rem;
    }
    input, textarea {
      width: 100%; background: #fff; border: 1px solid #ccc;
      border-radius: 3px; color: #333; padding: 0.5rem 0.65rem;
      font-size: 0.9rem; font-family: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: #999; }
    textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
    button {
      cursor: pointer; border: 1px solid #bbb; border-radius: 3px;
      padding: 0.5rem 1rem; font-size: 0.85rem; font-family: inherit;
      background: #e8e8e8; color: #333;
    }
    button:hover { background: #ddd; }
    button:active { opacity: 0.8; }
    .btn-wide { width: 100%; margin-top: 1rem; }
    .btn-submit { background: #e0e0e0; font-weight: bold; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; gap: 0.75rem; }

    .item { background: #fff; border: 1px solid #ddd; border-radius: 3px; padding: 0.75rem; margin-bottom: 0.5rem; }
    .item-title { color: #333; font-weight: bold; font-size: 0.85rem; }
    .item-date  { color: #888; font-size: 0.72rem; margin-top: 0.15rem; }
    .item-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
    .item-actions button { font-size: 0.75rem; padding: 0.3rem 0.6rem; }

    .msg { padding: 0.55rem 0.75rem; border-radius: 3px; font-size: 0.8rem; margin-bottom: 0.85rem; background: #efefef; border: 1px solid #ddd; color: #555; }

    #setup, #main, #editor { display: none; max-width: 520px; margin: 0 auto; }
    .foot { font-size: 0.72rem; color: #aaa; text-align: center; margin-top: 1.25rem; }
    .foot a { color: #aaa; }
    .empty { color: #999; font-size: 0.82rem; font-style: italic; padding: 0.4rem 0; }
  </style>
</head>
<body>

<div id="setup">
  <h2>Sign in</h2>
  <label>Access key</label>
  <input type="password" id="tokenInput" autocomplete="off" />
  <div id="setupStatus"></div>
  <button class="btn-submit btn-wide" onclick="saveToken()">Continue</button>
</div>

<div id="main">
  <div class="header">
    <h2>Entries</h2>
    <button onclick="showEditor(null)">+ Add</button>
  </div>
  <div id="mainStatus"></div>
  <div id="notesList"></div>
  <p class="foot"><a href="#" onclick="clearToken()">Sign out</a></p>
</div>

<div id="editor">
  <div class="header">
    <h2 id="editorHeading">New entry</h2>
    <button onclick="showMain()">&larr; Back</button>
  </div>
  <div id="editorStatus"></div>
  <label>Title</label>
  <input type="text" id="fTitle" />
  <label>Date</label>
  <input type="date" id="fDate" />
  <label>Summary</label>
  <input type="text" id="fPreview" />
  <label>Body</label>
  <textarea id="fContent"></textarea>
  <label>Tags</label>
  <input type="text" id="fTags" />
  <button class="btn-submit btn-wide" onclick="saveNote()">Save</button>
</div>

<script>
const OWNER  = 'Andrew-most-likely';
const REPO   = 'Personal-Website';
const FILE   = 'JSON/notes.json';
const BRANCH = 'main';

let token        = localStorage.getItem('gh_token');
let notesSha     = null;
let notes        = [];
let editingIndex = null;

function show(id) {
  ['setup', 'main', 'editor'].forEach(s => document.getElementById(s).style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

function setStatus(elId, msg) {
  const el = document.getElementById(elId);
  el.innerHTML = msg ? `<div class="msg">${msg}</div>` : '';
}

async function ghFetch(path, opts = {}) {
  return fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${path}`, {
    ...opts,
    headers: {
      Authorization: `token ${token}`,
      Accept: 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
}

async function loadNotes() {
  const res = await ghFetch(`contents/${FILE}?ref=${BRANCH}`);
  if (!res.ok) throw new Error(`${res.status}`);
  const data   = await res.json();
  notesSha     = data.sha;
  const parsed = JSON.parse(atob(data.content.replace(/\n/g, '')));
  notes        = parsed.notes || [];
}

async function commitNotes(message) {
  const body    = JSON.stringify({ notes }, null, 2);
  const encoded = btoa(unescape(encodeURIComponent(body)));
  const res = await ghFetch(`contents/${FILE}`, {
    method: 'PUT',
    body: JSON.stringify({ message, content: encoded, sha: notesSha, branch: BRANCH })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || 'Failed');
  }
  const data = await res.json();
  notesSha = data.content.sha;
}

function today() { return new Date().toISOString().slice(0, 10); }

async function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  token = t;
  setStatus('setupStatus', 'Checking…');
  try {
    await loadNotes();
    localStorage.setItem('gh_token', token);
    showMain();
  } catch (e) {
    setStatus('setupStatus', 'Invalid key.');
  }
}

function clearToken() {
  localStorage.removeItem('gh_token');
  token = null;
  show('setup');
}

async function showMain() {
  show('main');
  setStatus('mainStatus', 'Loading…');
  document.getElementById('notesList').innerHTML = '';
  try {
    await loadNotes();
    setStatus('mainStatus', '');
    renderList();
  } catch (e) {
    setStatus('mainStatus', 'Could not load. Key may have expired.');
  }
}

function renderList() {
  const list   = document.getElementById('notesList');
  const sorted = [...notes]
    .map((n, i) => ({ ...n, _i: i }))
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  if (sorted.length === 0) {
    list.innerHTML = '<p class="empty">No entries.</p>';
    return;
  }
  list.innerHTML = sorted.map(note => `
    <div class="item">
      <div class="item-title">${note.title}</div>
      <div class="item-date">${note.date}</div>
      <div class="item-actions">
        <button onclick="showEditor(${note._i})">Edit</button>
        <button onclick="deleteNote(${note._i})">Delete</button>
      </div>
    </div>
  `).join('');
}

function showEditor(index) {
  editingIndex = index;
  show('editor');
  document.getElementById('editorStatus').innerHTML = '';

  if (index === null) {
    document.getElementById('editorHeading').textContent = 'New entry';
    document.getElementById('fTitle').value   = '';
    document.getElementById('fDate').value    = today();
    document.getElementById('fPreview').value = '';
    document.getElementById('fContent').value = '';
    document.getElementById('fTags').value    = '';
  } else {
    const n = notes[index];
    document.getElementById('editorHeading').textContent = 'Edit entry';
    document.getElementById('fTitle').value   = n.title;
    document.getElementById('fDate').value    = n.date;
    document.getElementById('fPreview').value = n.preview;
    document.getElementById('fContent').value = n.content;
    document.getElementById('fTags').value    = n.tags.join(', ');
  }
}

async function saveNote() {
  const title   = document.getElementById('fTitle').value.trim();
  const date    = document.getElementById('fDate').value;
  const preview = document.getElementById('fPreview').value.trim();
  const content = document.getElementById('fContent').value.trim();
  const tags    = document.getElementById('fTags').value
    .split(',').map(t => t.trim()).filter(Boolean);

  if (!title || !date || !content) {
    setStatus('editorStatus', 'Required fields missing.');
    return;
  }

  setStatus('editorStatus', 'Saving…');

  const note = { title, date, preview, content, tags, lastUpdated: today() };
  const prev = editingIndex !== null ? notes[editingIndex] : null;

  if (editingIndex === null) {
    notes.push(note);
  } else {
    notes[editingIndex] = note;
  }

  try {
    const msg = editingIndex === null ? `Add note: ${title}` : `Update note: ${title}`;
    await commitNotes(msg);
    setStatus('editorStatus', 'Saved.');
    setTimeout(showMain, 1800);
  } catch (e) {
    if (editingIndex === null) notes.pop();
    else if (prev) notes[editingIndex] = prev;
    setStatus('editorStatus', `Error: ${e.message}`);
  }
}

async function deleteNote(index) {
  const n = notes[index];
  if (!confirm(`Delete "${n.title}"?`)) return;
  const removed = notes.splice(index, 1)[0];
  setStatus('mainStatus', 'Deleting…');
  try {
    await commitNotes(`Delete note: ${removed.title}`);
    renderList();
    setStatus('mainStatus', '');
  } catch (e) {
    notes.splice(index, 0, removed);
    setStatus('mainStatus', `Error: ${e.message}`);
  }
}

if (token) showMain();
else show('setup');
</script>
</body>
</html>
