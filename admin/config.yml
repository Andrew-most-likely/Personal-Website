backend:
  name: github
  repo: Andrew-most-likely/Personal-Website
  branch: main
  auth_type: pkce
  app_id: Ov23liLFeYsNcZdcfdrv

# Setup steps (one-time):
#   1. Go to github.com → Settings → Developer settings → OAuth Apps → New OAuth App
#   2. Application name: cappel.li admin
#   3. Homepage URL: https://cappel.li
#   4. Authorization callback URL: https://cappel.li/admin/
#   5. Register the app, copy the Client ID
#   6. Replace REPLACE_WITH_YOUR_GITHUB_OAUTH_APP_CLIENT_ID above with that Client ID
#   7. Push to GitHub, then visit https://cappel.li/admin/ and sign in with GitHub

media_folder: Personal-Website/ASSETS/IMAGES
public_folder: /ASSETS/IMAGES

collections:
  - name: notes
    label: Notes
    files:
      - name: notes_list
        label: Notes List
        file: Personal-Website/JSON/notes.json
        fields:
          - name: notes
            label: Notes
            label_singular: Note
            widget: list
            fields:
              - label: Title
                name: title
                widget: string
              - label: Date
                name: date
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
              - label: Preview
                name: preview
                widget: string
                hint: Short teaser shown on the notes listing page
              - label: Content
                name: content
                widget: text
                hint: Full note body (plain text, no markdown)
              - label: Tags
                name: tags
                widget: list
                allow_add: true
                field:
                  label: Tag
                  name: tag
                  widget: string
              - label: Last Updated
                name: lastUpdated
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
